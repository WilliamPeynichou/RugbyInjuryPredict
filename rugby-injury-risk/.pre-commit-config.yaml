repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=5120]
  - repo: local
    hooks:
      - id: protect-data
        name: Refuse sensitive data and secrets
        entry: python3 rugby-injury-risk/scripts/check_sensitive_files.py
        language: system
        pass_filenames: true
