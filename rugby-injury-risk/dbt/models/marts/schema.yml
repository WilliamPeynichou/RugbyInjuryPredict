version: 2
models:
  - name: dim_competition
    columns: [{name: competition_code, data_tests: [unique, not_null]}]
  - name: dim_season
    columns: [{name: season_id, data_tests: [unique, not_null]}]
  - name: dim_venue
    columns: [{name: venue_id, data_tests: [unique, not_null]}]
  - name: dim_player
    columns:
      - {name: player_id, data_tests: [unique, not_null]}
      - {name: player_key, data_tests: [unique, not_null]}
  - name: venue_surface
    columns:
      - {name: venue_id, data_tests: [not_null, {relationships: {to: ref('dim_venue'), field: venue_id}}]}
      - {name: season_id, data_tests: [not_null, {relationships: {to: ref('dim_season'), field: season_id}}]}
