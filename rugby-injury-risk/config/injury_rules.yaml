# Injury labelling rules (F12+). Only place where these thresholds live; dbt receives them as vars.
exit_signal:
  # Starter off before this minute (by position_group) = early exit. Forwards are replaced
  # early for tactical reasons, hence lower thresholds.
  early_exit_minute: { front_row: 40, lock: 45, back_row: 45, half_back: 55, centre: 55, back_three: 55 }
  early_exit_strength: 0.7
  very_early_minute: 20
  very_early_strength: 0.8
  sub_off_strength: 0.9
  block_change_factor: 0.3
  absent_next_bonus: 0.2
  suspected_threshold: 0.7
absence_signal:
  min_matches_injury_candidate: 2
  suspension_max_matches: 6
  protected_rest_max_matches: 1
  exit_link_threshold: 0.5
  intl_history_days: 365
fusion:
  # Fenêtre de groupement des signaux d'un même joueur (jours)
  signal_window_days: 10
  # Deux épisodes fusionnés si l'écart (onset2 vs fin de l'épisode 1) < N jours
  merge_gap_days: 7
  # Score de confiance des épisodes (table des combinaisons)
  announcement_alone: 0.7
  announcement_detail_bonus: 0.1
  exit_absence: 0.75
  exit_announcement: 0.9
  exit_absence_announcement: 0.95
  exit_weight: 0.6
  absence_alone: 0.4
  confidence_cap: 0.99
