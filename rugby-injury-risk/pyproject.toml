[project]
name = "rugby-injury-risk"
version = "0.1.0"
description = "Analyse agrégée du risque de blessure dans le rugby"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx",
    "selectolax",
    "pydantic>=2",
    "pydantic-settings",
    "structlog",
    "polars",
    "duckdb",
    "pyyaml",
    "pandera",
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
    "numpy>=2.5.4",
    "pyarrow>=26.0.1",
    "zstandard>=0.25.0",
    "dagster>=1.10",
    "dagster-webserver>=1.13.28",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov", "pytest-asyncio", "respx", "pre-commit", "types-PyYAML"]

[project.scripts]
rugby-risk = "rugby_risk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rugby_risk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
"src/rugby_risk/parsers/**" = ["PLR2004"]
"tests/fixtures/**" = ["PLR2004", "PLR0913", "PLR0917", "E501"]

[[tool.mypy.overrides]]
module = ["orchestration.*"]
disallow_untyped_defs = false
disallow_any_generics = false

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = '-m "not network and not slow"'
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["unit: unit tests", "integration: integration tests", "slow: slow tests", "network: tests requiring network"]
